<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumeykha Perpustakaan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafaf9;
            color: #292524;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header {
            background-color: #fff;
            border-bottom: 1px solid #e7e5e4;
            padding: 16px 0;
            position: sticky; top: 0; z-index: 10;
        }
        header .container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 700; color: #0d9488; }
        nav a { text-decoration: none; color: #57534e; margin-left: 24px; font-weight: 500; }
        nav a:hover { color: #0d9488; }
        .hero { text-align: center; padding: 80px 20px; }
        .hero h1 { font-size: 48px; font-weight: 700; margin-bottom: 16px; }
        .hero p { font-size: 18px; color: #78716c; max-width: 600px; margin: 0 auto; }
        .book-list-section { padding: 40px 0 80px 0; }
        .book-list-section h2 { font-size: 32px; text-align: center; margin-bottom: 40px; }
        .books {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }
        .book-card {
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s ease-in-out;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.07);
        }
        .book-cover { width: 100%; height: 300px; object-fit: cover; }
        .book-info { padding: 16px; }
        .book-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .book-info p { font-size: 14px; color: #78716c; }
        .tag {
            display: inline-block;
            background-color: #ccfbf1;
            color: #115e59;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 12px;
        }
        footer {
            background-color: #292524;
            color: #e7e5e4;
            text-align: center;
            padding: 40px 20px;
            margin-top: 40px;
        }
        footer p { color: #a8a29e; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">Yumeykha Perpustakaan</div>
            <nav>
                <a href="#">Koleksi</a>
                <a href="#">Tentang</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Yumeykha Perpustakaan</h1>
                <p>Jelajahi koleksi buku kurasi pribadi. Temukan bacaan favoritmu berikutnya di sini.</p>
            </div>
        </section>

        <section class="book-list-section">
            <div class="container">
                <h2>Koleksi Terbaru</h2>
                <div class="books" id="book-list">
                    <p style="text-align:center; color:#78716c;">Memuat koleksi buku...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Yumeykha Perpustakaan. Dibuat dengan cinta.</p>
        </div>
    </footer>

<script>
fetch('./books.json')
  .then(res => res.json())
  .then(books => {
    const container = document.getElementById('book-list');
    if(books.length === 0){
      container.innerHTML = '<p style="text-align:center; color:#78716c;">Belum ada buku di koleksi</p>';
      return;
    }
    container.innerHTML = books.map(book => `
      <div class="book-card">
        <img src="${book.cover}" class="book-cover" alt="${book.judul}" loading="lazy">
        <div class="book-info">
          <h3>${book.judul}</h3>
          <p>${book.penulis}</p>
          <span class="tag">${book.kategori}</span>
        </div>
      </div>
    `).join('');
  })
  .catch(err => {
    document.getElementById('book-list').innerHTML = '<p style="text-align:center; color:#dc2626;">Gagal memuat data buku</p>';
  });
</script>
</body>
</html>
