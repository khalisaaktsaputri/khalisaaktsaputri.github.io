<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yumeykha's Space</title>
    <style>
        :root {
            /* URL Gambar Waifu (Silakan ganti link di bawah ini dengan gambar waifu pilihanmu) */
            --waifu-url: url('https://unsplash.com');
            
            --bg-glass: rgba(252, 251, 250, 0.75); /* Kaca transparan cream */
            --panel-glass: rgba(255, 255, 255, 0.85); /* Kotak artikel transparan */
            --text-color: #2d3748; 
            --text-muted: #4a5568; 
            --accent-color: #e5a99e; 
            --accent-hover: #d49387;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* Background Gambar Waifu Full Layar */
        body { 
            margin: 0;
            padding-top: 70px; 
            -webkit-font-smoothing: antialiased; 
            background-image: var(--waifu-url);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Gambar diam saat di-scroll */
            min-height: 100vh;
        }
        
        /* Header Transparan Buram */
        header { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: rgba(252, 251, 250, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid rgba(237, 242, 247, 0.5); z-index: 100; }
        .menu-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 6px; z-index: 110; padding: 5px; }
        .menu-btn span { display: block; width: 22px; height: 2px; background: var(--text-color); transition: 0.3s; }
        .web-title { margin-left: 20px; font-size: 1.1rem; font-weight: 600; color: var(--text-color); letter-spacing: 2px; text-transform: uppercase; }
        
        /* Sidebar Menu */
        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 100px 24px 24px 24px; transition: cubic-bezier(0.4, 0, 0.2, 1) 0.4s; border-right: 1px solid rgba(237, 242, 247, 0.5); z-index: 105; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 10px 0 30px rgba(0,0,0,0.05); }
        .sidebar.active { left: 0; }
        .nav-links { display: flex; flex-direction: column; gap: 12px; }
        .nav-links a { color: var(--text-color); text-decoration: none; font-size: 1rem; font-weight: 500; padding: 12px 16px; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-links a:hover { background: rgba(252, 251, 250, 0.8); color: var(--accent-color); }
        
        /* Status Sistem */
        .sys-status { font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid rgba(237, 242, 247, 0.5); padding-top: 20px; font-weight: 500; }
        .status-dot { display: inline-block; width: 6px; height: 6px; background: #38a169; border-radius: 50%; margin-right: 6px; animation: blink 2s infinite; vertical-align: middle; }
        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        /* Area Konten Utama dengan Efek Kaca agar Tulisan Jelas */
        main { max-width: 750px; margin: 40px auto; padding: 40px 24px; background: var(--bg-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .hero { margin-bottom: 50px; }
        .hero h1 { font-size: 2.2rem; font-weight: 700; color: var(--text-color); margin-bottom: 12px; letter-spacing: -0.5px; }
        .hero p { color: var(--text-muted); font-size: 1.05rem; line-height: 1.6; font-weight: 500; }
        
        /* Timeline Daftar Artikel Otomatis */
        .article-list { display: flex; flex-direction: column; gap: 24px; position: relative; }
        .article-card { background: var(--panel-glass); padding: 28px; border-radius: 12px; border: 1px solid rgba(237, 242, 247, 0.6); text-decoration: none; color: inherit; display: block; transition: all 0.3s ease; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .article-card:hover { border-color: var(--accent-color); transform: translateY(-2px); background: rgba(255, 255, 255, 0.95); box-shadow: 0 10px 20px rgba(229, 169, 158, 0.15); }
        .article-date { font-size: 0.8rem; font-weight: 600; color: var(--accent-color); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .article-card h2 { font-size: 1.35rem; font-weight: 600; margin-bottom: 10px; line-height: 1.4; color: var(--text-color); transition: 0.2s; }
        .article-card:hover h2 { color: var(--accent-hover); }
        .article-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; font-weight: 500; }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <div class="web-title">Yumeykha's Space //</div>
    </header>

    <div class="sidebar" id="sidebar">
        <div class="nav-links">
            <a href="index.html" onclick="toggleMenu()">📊 Dashboard</a>
            <a href="changelog.html" onclick="toggleMenu()">📚 Changelog</a>
            <a href="tech-stack.html" onclick="toggleMenu()">🛠️ Tech Stack & Lab</a>
            <a href="about.html" onclick="toggleMenu()">🧑‍💻 Core Contributor</a>
            <a href="contact.html" onclick="toggleMenu()">📞 API Endpoint</a>
        </div>
        <div class="sys-status">
            <span class="status-dot"></span> All Systems Operational
            <div style="margin-top: 6px; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.5px;">v1.0.0</div>
        </div>
    </div>

    <main>
        <div class="hero">
            <h1>Welcome to my digital garden.</h1>
            <p>Sebuah ruang minimalis untuk dokumentasi pengembangan sistem web, catatan riset teknologi mandiri, serta resolusi anomali kode.</p>
        </div>

        <div class="article-list" id="daftar-isi">
            <!-- Artikel otomatis diisi oleh JavaScript -->
        </div>
    </main>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('.menu-btn');
            if (!sidebar.contains(event.target) && !menuBtn.contains(event.target)) {
                sidebar.classList.remove('active');
            }
        });

        fetch('artikel-list.json')
            .then(response => response.json())
            .then(data => {
                const listContainer = document.getElementById('daftar-isi');
                if(!data || data.length === 0) {
                    listContainer.innerHTML = '<p style="color:var(--text-muted); font-style: italic;">Belum ada catatan belajar yang ditambahkan.</p>';
                    return;
                }
                data.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'article-card';
                    card.href = item.file;
                    card.innerHTML = `
                        <div class="article-date">${item.tanggal}</div>
                        <h2>${item.judul}</h2>
                        <p>${item.deskripsi}</p>
                    `;
                    listContainer.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('daftar-isi').innerHTML = '<p style="color:#e53e3e;">Gagal memuat catatan (JSON Connection Error).</p>';
            });
    </script>
</body>
</html>
